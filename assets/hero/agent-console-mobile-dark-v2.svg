  <g id="icon-git-m"><circle cx="12" cy="12" r="11.5" fill="#0D1B2E" fill-opacity="0.9" stroke="#F05032" stroke-width="1.2" stroke-opacity="0.85"/><circle cx="8" cy="6" r="2" fill="none" stroke="#F05032" stroke-width="1"/><circle cx="8" cy="18" r="2" fill="none" stroke="#F05032" stroke-width="1"/><circle cx="17" cy="12" r="2" fill="none" stroke="#F05032" stroke-width="1"/><line x1="8" y1="8" x2="8" y2="16" stroke="#F05032" stroke-width="1"/><line x1="8" y1="16" x2="15" y2="13" stroke="#F05032" stroke-width="1"/><line x1="8" y1="8" x2="15" y2="11" stroke="#F05032" stroke-width="1"/></g>
