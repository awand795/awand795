  <g id="icon-react-m"><circle cx="12" cy="12" r="11.5" fill="#0D1B2E" fill-opacity="0.9" stroke="#61DAFB" stroke-width="1.2" stroke-opacity="0.85"/><ellipse cx="12" cy="12" rx="5.5" ry="6" fill="none" stroke="#61DAFB" stroke-width="1"/><ellipse cx="12" cy="12" rx="5.5" ry="6" fill="none" stroke="#61DAFB" stroke-width="1" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="5.5" ry="6" fill="none" stroke="#61DAFB" stroke-width="1" transform="rotate(120 12 12)"/><circle cx="12" cy="12" r="2" fill="#61DAFB"/></g>
