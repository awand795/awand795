# GitHub Action: Auto-update SVG Console Card with live stats
#
# Every day at 00:00 UTC, this workflow:
# 1. Fetches live stats from the GitHub API (repos, followers, last activity)
# 2. Reads template SVGs (*.svg.template), replaces placeholder tokens with real data
# 3. Outputs fresh production SVGs (*.svg) that your README references
# 4. Commits and pushes any changes
#
# Template files (*.svg.template) always retain their placeholders,
# so this workflow produces fresh stats every single run.

name: Update SVG Console Card

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual run from the Actions tab

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-svg-stats:
    name: Generate SVG with live GitHub stats
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GitHub stats & generate SVG files
        run: python scripts/update_svg_stats.py

      - name: Install rsvg-convert (SVG→PNG)
        run: sudo apt-get install -y librsvg2-bin

      - name: Strip animations & generate static SVG for PNG
        run: python scripts/strip_svg_animations.py assets/hero/agent-console-dark.svg assets/hero/agent-console-static.svg

      - name: Generate PNG fallback from static SVG
        run: |
          rsvg-convert assets/hero/agent-console-static.svg -o assets/hero/agent-console.png
          rm -f assets/hero/agent-console-static.svg

      - name: Check for changes
        id: git-check
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "  Changes detected — SVG/PNG files updated with fresh stats."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "  No changes — files already reflect current stats."
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --global user.name "awand795-bot"
          git config --global user.email "awand795@users.noreply.github.com"
          git add assets/hero/
          git commit -m "Updated SVG console card with live stats

          Auto-updated by GitHub Actions (daily schedule)
          Co-Authored-By: awand795-bot <awand795@users.noreply.github.com>"
          git push
