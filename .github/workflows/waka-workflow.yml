# GitHub Action for updating WakaTime stats in README
# Instructions:
# 1. Add WAKATIME_API_KEY to your GitHub Repository Secrets
# 2. Create a file at .github/workflows/wakatime.yml
# 3. Paste this content and commit

name: WakaTime Stats Update

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual run

jobs:
  update-readme:
    name: Update WakaTime Stats
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: true
          BLOCKS: ░▒▓█
          TIME_RANGE: last_7_days
          LANG_COUNT: 10
          SHOW_TIME: true
          SHOW_MASKED_TIME: true
          STOP_AT_OTHER: true
